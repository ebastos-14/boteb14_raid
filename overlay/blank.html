<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
body {
  margin:0;
  background: transparent;
  overflow:hidden;
}
</style>
</head>

<body>

<script>
const params = new URLSearchParams(window.location.search);
let channel = (params.get("channel") || "")
  .toLowerCase()
  .replace("#","")
  .trim();

async function loop() {
  try {
    const res = await fetch(`https://boteb14-raid.onrender.com/state?channel=${channel}&t=${Date.now()}`);
    const data = await res.json();

    if (data.active) {
      window.location.href = `./index.html?channel=${channel}`;
    }
  } catch (e) {}
}

setInterval(loop, 1000);
</script>

</body>
</html>
