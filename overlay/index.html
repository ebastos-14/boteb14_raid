<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<style>
body {
  margin:0;
  font-family: Arial;
  color:white;
  overflow:hidden;
  background: transparent;
}

/* CONTENEDOR */
#screen {
  width:100vw;
  height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
}

/* TEXTOS */
.text {
  font-size:20px;
  margin:4px 0;
  text-shadow:
    0 0 2px rgba(0,0,0,0.6),
    0 0 4px rgba(0,0,0,0.4),
    0 0 6px rgba(150,150,150,0.3);
}
  
.textf {
  font-size:20px;
  margin:4px 0;
  color: white;
}

/* TEXTO CIAN */
.textCian {
  color:#51D1F6;
  text-shadow:
    0 0 5px #00FFFF,
    0 0 10px #00FFFF,
    0 0 20px #00FFFF;
}

/* TEXTO DORADO */
.textGold {
  color:#FFA500;
  text-shadow:
    0 0 5px #FFD700,
    0 0 10px #FFD700,
    0 0 20px #FFD700;
}

/* ANIMACION DE CAIDA */
.introAnim { 
  animation: introFade 0.6s ease-out;
}

@keyframes introFade {
  from { opacity:0; transform: translateY(-50px); }
  to   { opacity:1; transform: translateY(0); }
}

/* SLOT */
.slot {
  width:300px;
  height:300px;
  display:flex;
  align-items:center;
  justify-content:center;
  margin:0 auto;
  position:relative;
}

/* ZOOM IN */
.zoomIn {
  animation: zoomInAnim 0.8s ease-out forwards;
}

@keyframes zoomInAnim {
  0% {
    transform: scale(0.3);
    opacity: 0;
    filter: blur(5px);
  }
  100% {
    transform: scale(1);
    opacity: 1;
    filter: blur(0);
  }
}

/* PORTAL */
#portalWrapper {
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  animation: spin 3s linear infinite;
}

#portalImg {
  width:100%;
  height:100%;
  object-fit:contain;
  animation: pulse 2s ease-in-out infinite,
             glowPortal 2s ease-in-out infinite;
}

#bossImg {
  width:100%;
  height:100%;
  object-fit:contain;
  animation: glowBoss 6s ease-in-out infinite;
}

@keyframes spin {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

@keyframes pulse {
  0% { transform: scale(1); }
  50% { transform: scale(1.08); }
  100% { transform: scale(1); }
}

@keyframes glowPortal {
  0% { filter: drop-shadow(0 0 5px #a8e1f1); }
  50% { filter: drop-shadow(0 0 20px #a8e1f1); }
  100% { filter: drop-shadow(0 0 5px #a8e1f1); }
}

@keyframes glowBoss {
  0% { filter: drop-shadow(0 0 5px #ffebba); }
  50% { filter: drop-shadow(0 0 20px #ffebba); }
  100% { filter: drop-shadow(0 0 5px #ffebba); }
}

/* BARRA VIDA */
#bar {
  width:260px;
  height:12px;
  margin:10px auto;
  position:relative;
  background:#2a0000;
  border:2px solid #999;
  overflow:hidden;
}

#hp {
  position:absolute;
  top:0;
  left:0;
  height:100%;
  width:100%;
  background:#ff0000;
  transition:width 0.3s linear;
  z-index:1;
}

#segments {
  position:absolute;
  width:100%;
  height:100%;
  display:flex;
  z-index:2;
}

.segment {
  flex:1;
  position:relative;
}

.segment:not(:last-child)::after {
  content:"";
  position:absolute;
  right:0;
  width:2px;
  height:100%;
  background:#000;
}

#hpText { margin-top:5px; }

#bossName { font-size:24px; }

#bossArea {
  width:300px;
  height:300px;
  position:relative;
}

/* FINAL */
#end {
  position:absolute;
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
}

#endContainer {
  position:relative;
  text-align:center;
}

/* 🔥 BOSS FONDO */
#endBoss {
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%, -50%);
  width:400px;
  filter: blur(2px) brightness(0.7);
  pointer-events:none;
  z-index:0;
}

/* 🔥 TEXTOS ENCIMA */
#result,
#resultSub,
#finalTimer {
  position:relative;
  z-index:1;
}

#result { font-size:40px; }

.win {
  color:#00ff99;
}

.lose {
  color:#ff4444;
}

</style>
</head>

<body>

<div id="screen">

<div id="intro">
  <div class="text textCian">📢 Estable v3 - v1-1 📢</div>
  <div class="text">💥 Recuerda participar usando !attack 💥</div>

  <div class="slot">
    <div id="portalWrapper">
      <div class="zoomIn">
        <img id="portalImg" src="./portal.png">
      </div>
    </div>
  </div>
</div>

<div id="boss" style="display:none">
  <div class="textGold introAnim" id="bossName"></div>

  <div class="introAnim" id="bar">
    <div id="hp"></div>
    <div id="segments">
      <div class="segment"></div>
      <div class="segment"></div>
      <div class="segment"></div>
      <div class="segment"></div>
      <div class="segment"></div>
    </div>
  </div>

  <div class="text introAnim" id="hpText"></div>

  <div id="bossArea">
    <img id="bossImg">
  </div>

  <div class="text introAnim" id="timer2"></div>
</div>

<div id="end" style="display:none">
  <div id="endContainer">
    <img id="endBoss">
    <div class="text textf" id="result"></div>
    <div class="text textf" id="resultSub"></div>
    <div class="text textf" id="finalTimer"></div>
  </div>
</div>

</div>

<script>
const params=new URLSearchParams(location.search);
let channel=(params.get("channel")||"").toLowerCase();

const bossSprites={
"Constructor":"./Constructor.png",
"Sacerdotiza Avaloniana":"./SacerdotizaAvaloniana.png",
"Basilisco":"./Basilisco.png",
"Capitán Caballero":"./CapitanCaballero.png",
"Reina Danzante":"./ReinaDanzante.png",
"Sir Bedivere":"./SirBedivere.png"
};

let lastHP=null;
let finalRunning=false;

setInterval(async()=>{
const res=await fetch(`https://boteb14-raid.onrender.com/state?channel=${channel}&t=${Date.now()}`);
const data=await res.json();

if(data.active&&data.bossSpawned){
boss.style.display="block";
bossName.innerText=data.boss;
hp.style.width=(data.hp/data.maxHP)*100+"%";
hpText.innerText=`${data.hp}/${data.maxHP}`;
bossImg.src=bossSprites[data.boss];
timer2.innerText=`⏱️ ${data.timeLeft}`;
}

if(data.finished){
end.style.display="flex";
endBoss.src=bossSprites[data.boss];

result.innerText=data.result==="win"?"🏆 VICTORIA 🏆":"☠️ DERROTA ☠️";
resultSub.innerText=data.result==="win"
?`Hemos vencido a ${data.boss}`
:`${data.boss} ha logrado escapar`;

result.className=data.result==="win"?"win":"lose";
}

},500);
</script>

</body>
</html>
