<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<style>
body {
  margin:0;
  font-family: Arial;
  color:white;
  overflow:hidden;
  background: transparent;
}

/* CONTENEDOR */
#screen {
  width:100vw;
  height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
}

/* TEXTOS */
.text {
  font-size:20px;
  margin:4px 0;
  text-shadow:
    0 0 2px rgba(0,0,0,0.6),
    0 0 4px rgba(0,0,0,0.4),
    0 0 6px rgba(150,150,150,0.3);
}

.textCian {
  color:#51D1F6;
  text-shadow:0 0 10px #00FFFF;
}

.textGold {
  color:#FFA500;
  text-shadow:0 0 10px #FFD700;
}

/* SLOT */
.slot {
  width:300px;
  height:300px;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* PORTAL */
#portalWrapper {
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  animation: spin 3s linear infinite;
}

#portalImg {
  width:100%;
  animation: pulse 2s infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

@keyframes pulse {
  50% { transform: scale(1.08); }
}

/* BOSS */
#bossArea {
  width:300px;
  height:300px;
  position:relative;
}

#bossImg {
  width:100%;
  animation: glowBoss 6s infinite;
}

@keyframes glowBoss {
  50% { filter: drop-shadow(0 0 20px #ffebba); }
}

/* BARRA VIDA PRO */
#bar {
  width:260px;
  height:12px;
  margin:10px auto;
  position:relative;
  background:#2a0000;
  border:2px solid #999;
  overflow:hidden;
}

#hp {
  position:absolute;
  top:0;
  left:0;
  height:100%;
  width:100%;
  background:#ff0000;
  transform-origin:left;
  transform:scaleX(1);
  transition:transform 0.3s linear;
  z-index:1;
}

#segments {
  position:absolute;
  width:100%;
  height:100%;
  display:flex;
  z-index:2;
}

.segment {
  flex:1;
  border-right:2px solid black;
}

/* DAÑO */
.damage {
  position:absolute;
  color:#ff4444;
  font-weight:bold;
  animation: floatUp 1s forwards;
}

@keyframes floatUp {
  to { opacity:0; transform: translateY(-60px); }
}

/* SHAKE */
.shake {
  animation: shakeAnim 0.25s;
}

@keyframes shakeAnim {
  50% { transform: translate(4px,-2px); }
}

/* FINAL */
#end {
  position:absolute;
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
}

.win { color:#00ff99; }
.lose { color:#ff4444; }

</style>
</head>

<body>

<div id="screen">

<div id="intro">
  <div class="text textCian">📢 Evento iniciando</div>
  <div class="slot">
    <div id="portalWrapper">
      <img id="portalImg" src="./portal.png">
    </div>
  </div>
</div>

<div id="boss" style="display:none">
  <div id="bossName"></div>

  <div id="bar">
    <div id="hp"></div>
    <div id="segments">
      <div class="segment"></div>
      <div class="segment"></div>
      <div class="segment"></div>
      <div class="segment"></div>
      <div class="segment"></div>
    </div>
  </div>

  <div id="hpText"></div>

  <div id="bossArea">
    <img id="bossImg">
  </div>
</div>

<div id="end" style="display:none">
  <div>
    <div id="result"></div>
  </div>
</div>

</div>

<script>
const params = new URLSearchParams(location.search);
let channel = (params.get("channel") || "").toLowerCase();

let lastHP = null;

function spawnDamage(d){
  const el=document.createElement("div");
  el.className="damage";
  el.innerText=Math.floor(d);
  el.style.left="50%";
  el.style.top="50%";
  bossArea.appendChild(el);
  setTimeout(()=>el.remove(),1000);
}

function shakeBoss(){
  bossImg.classList.remove("shake");
  requestAnimationFrame(()=>bossImg.classList.add("shake"));
}

setInterval(async () => {

  const res = await fetch(`https://boteb14-raid.onrender.com/state?channel=${channel}&t=${Date.now()}`);
  const data = await res.json();

  if(data.active && data.bossSpawned){

    intro.style.display="none";
    boss.style.display="block";

    if(lastHP !== null && data.hp < lastHP){
      spawnDamage(lastHP - data.hp);
      shakeBoss();
    }

    lastHP = data.hp;

    bossName.innerText = data.boss;
    hp.style.transform = `scaleX(${data.hp / data.maxHP})`;
    hpText.innerText = `${data.hp}/${data.maxHP}`;
  }

  if(data.finished){
    boss.style.display="none";
    end.style.display="flex";

    result.innerText = data.result === "win" ? "🏆 VICTORIA" : "☠️ DERROTA";
  }

}, 500);
</script>

</body>
</html>
